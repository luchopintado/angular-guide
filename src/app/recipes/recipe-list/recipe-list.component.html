<div class="flex flex-wrap -mx-2">
  <div class="w-full px-2">
    <button class="px-4 py-2 rounded font-medium bg-green-600 text-white hover:bg-green-700">New Recipe</button>
  </div>
</div>
<hr class="my-4 border-gray-200" />
<div class="flex flex-wrap -mx-2">
  <div class="w-full px-2">
    <a href="#" class="flex items-start justify-between gap-4 py-3 px-3 border-b border-gray-200 hover:bg-gray-50 no-underline text-inherit block" *ngFor="let recipe of recipes">
      <div class="flex-1 min-w-0">
        <h4 class="font-semibold text-gray-900 m-0">{{ recipe.name }}</h4>
        <p class="text-gray-600 text-sm m-0 mt-1">{{ recipe.description }}</p>
      </div>
      <span class="shrink-0">
        <img [src]="recipe.imagePath" [alt]="recipe.name" class="max-h-12 w-auto object-contain" />
      </span>
    </a>
    <app-recipe-item></app-recipe-item>
  </div>
</div>
