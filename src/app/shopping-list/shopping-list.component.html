<div class="flex flex-wrap -mx-2">
  <div class="w-full px-2">
    <app-shopping-edit></app-shopping-edit>
    <hr class="my-4 border-gray-200" />
    <ul class="border border-gray-200 rounded divide-y divide-gray-200 list-none p-0 m-0">
      <li *ngFor="let ingredient of ingredients">
        <a href="#" class="block py-2 px-3 hover:bg-gray-100 cursor-pointer no-underline text-inherit">
          {{ ingredient.name }}
        </a>
      </li>
    </ul>
  </div>
</div>
