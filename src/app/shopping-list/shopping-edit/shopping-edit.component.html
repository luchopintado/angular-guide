<div class="flex flex-wrap -mx-2">
  <div class="w-full px-2">
    <form action="#">
      <div class="flex flex-wrap -mx-2 mb-4">
        <div class="w-full md:w-5/12 px-2 mb-4">
          <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Name</label>
          <input type="text" id="name" class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>
        <div class="w-full md:w-2/12 px-2 mb-4">
          <label for="amount" class="block text-sm font-medium text-gray-700 mb-1">Amount</label>
          <input type="text" id="amount" class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>
      </div>

      <div class="flex flex-wrap -mx-2">
        <div class="w-full px-2 flex gap-2">
          <button class="px-4 py-2 rounded font-medium bg-green-600 text-white hover:bg-green-700" type="submit">Add</button>
          <button class="px-4 py-2 rounded font-medium bg-red-600 text-white hover:bg-red-700" type="button">Delete</button>
          <button class="px-4 py-2 rounded font-medium bg-blue-600 text-white hover:bg-blue-700" type="button">Clear</button>
        </div>
      </div>
    </form>
  </div>
</div>
